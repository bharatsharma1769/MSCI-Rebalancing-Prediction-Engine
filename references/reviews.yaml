project:
  name: MSCI Rebalancing Prediction Engine
  config_version: '2.1'
  review_frequency: quarterly
  review_months:
  - February
  - May
  - August
  - November
  review_key_format: YYYY-MM
  identity_key: security_id
  primary_key:
  - review
  - security_id
conventions:
  equity_universe_cutoff: last NSE business day of the methodology equity-universe cutoff month
  liquidity_cutoff: last NSE business day of the methodology liquidity cutoff month
  price_cutoff:
    methodology_window: one of the last 10 business days of the month before the review month
    project_rule: deterministic historical market date used consistently across PIT reconstruction
    field_name: price_cutoff_market_date
  point_in_time:
    allow_data_after_review_cutoff: false
    same_review_label_use: false
    future_review_label_use: false
  fif_vintages:
    legacy: pre-Feb-2026 review FIF methodology
    feb_2026_transition: Feb-2026 transition treatment; historical public-data reconstruction is not exhaustive for every
      adjustment-event decrease
    may_2026_enhanced: 'May-2026 enhanced FIF rounding: >25% nearest 2.5%; 5-25% nearest 0.5%; <5% nearest 0.1%, with stability
      buffers'
